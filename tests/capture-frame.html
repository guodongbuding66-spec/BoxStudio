<!doctype html><html><head><meta charset="utf-8"><title>BoxStudio viewport acceptance</title><style>html,body{margin:0;background:#fff}iframe{display:block;border:0}</style></head><body><script>
const query=new URLSearchParams(location.search),frame=document.createElement('iframe');
frame.width=query.get('width')||'1280';frame.height=query.get('height')||'900';frame.title='BoxStudio test viewport';
frame.src=(query.get('mode')==='v68'?'./v68-browser-e2e.html?shot=':query.get('mode')==='v67'?'./v67-browser-e2e.html?shot=':query.get('mode')==='v66'?'./v66-browser-e2e.html?shot=':query.get('mode')==='live'?'./artwork-live.html?shot=':'./studio-screenshots.html?shot=')+encodeURIComponent(query.get('shot')||'artwork');document.body.appendChild(frame);
const end=Date.now()+70000,timer=setInterval(()=>{const data=frame.contentDocument?.body?.dataset;if(data?.v68Result){document.body.dataset.v68Result=data.v68Result;clearInterval(timer)}else if(data?.v67Result){document.body.dataset.v67Result=data.v67Result;clearInterval(timer)}else if(data?.v66Result){document.body.dataset.v66Result=data.v66Result;clearInterval(timer)}else if(data?.captureReady){document.body.dataset.captureReady=data.captureReady;clearInterval(timer)}else if(data?.captureError){document.body.dataset.captureError=data.captureError;clearInterval(timer)}else if(data?.liveArtworkResult){document.body.dataset.liveArtworkResult=data.liveArtworkResult;clearInterval(timer)}else if(Date.now()>end){document.body.dataset.captureError='Frame did not become ready';clearInterval(timer)}},100);
</script></body></html>
