<body data-v43-e2e="running">
<div id="app"></div><pre id="log"></pre>
<script src="../vendor/jszip.min.js"></script>
<script type="module">
  import { STORAGE_KEY, defaultState } from '../src/model.js';
  if(!sessionStorage.getItem('boxstudio-v43-stage')){
    const initial=structuredClone(defaultState);initial.page='editor';initial.editorTab='Structure';initial.savedAt=new Date().toISOString();
    localStorage.clear();localStorage.setItem(STORAGE_KEY,JSON.stringify(initial));sessionStorage.setItem('boxstudio-v43-stage','0');
    await fetch('/__v43_started__',{method:'POST',body:'V0.43 browser started'}).catch(()=>{});
  }
  await import('../src/app.js');
  await import('../src/v35Ui.js');
  await import('../src/v36Ui.js');
  await import('../src/v38Ui.js');
  await import('../src/v39Ui.js');
  await import('../src/v40Ui.js');
  await import('../src/v41Ui.js');
  await import('../src/v42Ui.js');
  await import('../src/v43Ui.js');
  await import('./v43-browser-e2e.js');
</script>
</body>
</html>
