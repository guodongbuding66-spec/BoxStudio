name: V0.81 Portable Projects and Cross-device Restore
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare
      - run: npm run test:v81
      - name: Native ZIP download, clean browser context restore and failure recovery
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node tests/v81-browser.mjs "$CHROME"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boxstudio-v81-portable-projects
          path: artifacts/v81/
