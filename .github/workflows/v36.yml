name: V0.36 Hosted Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hosted-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: V0.36 syntax checks
        run: |
          node --check server/domainV36.mjs
          node --check server/httpV36.mjs
          node --check src/hostedClientV36.js
          node --check src/v36Ui.js
          node --check tests/v36.mjs
          node --check tests/v36_browser_server.mjs
          node --check tests/v36-browser-e2e.js

      - name: V0.36 real HTTP auth/RBAC/immutable revision/audit integration
        run: node tests/v36.mjs

      - name: V0.36 browser workflow - operator submit, approver approve, audit visible
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v36-started /tmp/boxstudio-v36-pass /tmp/boxstudio-v36-fail
          node tests/v36_browser_server.mjs >/tmp/boxstudio-v36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8768/tests/v36-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=18000 --dump-dom http://127.0.0.1:8768/tests/v36-browser-e2e.html >/tmp/boxstudio-v36-dom.log 2>/tmp/boxstudio-v36-chrome.log || true
          if test -f /tmp/boxstudio-v36-pass; then
            cat /tmp/boxstudio-v36-pass
          elif test -f /tmp/boxstudio-v36-fail; then
            cat /tmp/boxstudio-v36-fail
            cat /tmp/boxstudio-v36-http.log || true
            cat /tmp/boxstudio-v36-chrome.log || true
            cat /tmp/boxstudio-v36-dom.log || true
            exit 1
          else
            echo 'V0.36 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v36-http.log || true
            cat /tmp/boxstudio-v36-chrome.log || true
            cat /tmp/boxstudio-v36-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
