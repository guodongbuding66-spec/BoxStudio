name: V0.49 Linked 2D-3D Workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linked-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: V0.49 syntax
        run: |
          node --check src/linkedWorkspaceV49.js
          node --check src/v49Ui.js
          node --check tests/v49.mjs
          node --check tests/v49-browser-e2e.js
          python3 -m py_compile tests/v49_e2e_server.py
      - name: Linked-review baseline
        run: node tests/v35.mjs
      - name: V0.48 template baseline
        run: node tests/v48.mjs
      - name: V0.49 linked workspace model
        run: node tests/v49.mjs
      - name: Production-chain baseline
        run: node tests/v39.mjs
      - name: V0.49 wiring
        run: |
          node -e "const p=require('./package.json');if(Number(p.version.split('.')[1])<49)process.exit(1)"
          grep -q '"test:v49"' package.json
          grep -q 'v49Ui.css' index.html
          grep -q 'v49Ui.js' index.html
          grep -q 'V49_LINKED_SCHEMA' src/linkedWorkspaceV49.js
          grep -q 'onSelectPanel' src/v49Ui.js
          grep -q '开合动画' src/v49Ui.js
      - name: Real Chrome linked 2D-3D workflow
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v49-started /tmp/boxstudio-v49-pass /tmp/boxstudio-v49-fail
          python3 tests/v49_e2e_server.py >/tmp/boxstudio-v49-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8779/tests/v49-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 90s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --window-size=1280,900 --virtual-time-budget=65000 --dump-dom http://127.0.0.1:8779/tests/v49-browser-e2e.html >/tmp/boxstudio-v49-dom.log 2>/tmp/boxstudio-v49-chrome.log || true
          if test -f /tmp/boxstudio-v49-pass; then
            echo 'Desktop linked workspace:'; cat /tmp/boxstudio-v49-pass
          elif test -f /tmp/boxstudio-v49-fail; then
            cat /tmp/boxstudio-v49-fail; cat /tmp/boxstudio-v49-chrome.log || true; cat /tmp/boxstudio-v49-dom.log || true; exit 1
          else
            echo 'V0.49 desktop browser E2E ended without PASS/FAIL signal.'; cat /tmp/boxstudio-v49-http.log || true; cat /tmp/boxstudio-v49-chrome.log || true; cat /tmp/boxstudio-v49-dom.log || true; exit 1
          fi
          rm -f /tmp/boxstudio-v49-pass /tmp/boxstudio-v49-fail
          timeout 90s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --window-size=390,844 --virtual-time-budget=65000 --dump-dom http://127.0.0.1:8779/tests/v49-browser-e2e.html >/tmp/boxstudio-v49-mobile-dom.log 2>/tmp/boxstudio-v49-mobile-chrome.log || true
          if test -f /tmp/boxstudio-v49-pass; then
            echo 'Mobile linked workspace:'; cat /tmp/boxstudio-v49-pass
          elif test -f /tmp/boxstudio-v49-fail; then
            cat /tmp/boxstudio-v49-fail; cat /tmp/boxstudio-v49-mobile-chrome.log || true; cat /tmp/boxstudio-v49-mobile-dom.log || true; exit 1
          else
            echo 'V0.49 mobile browser E2E ended without PASS/FAIL signal.'; cat /tmp/boxstudio-v49-http.log || true; cat /tmp/boxstudio-v49-mobile-chrome.log || true; cat /tmp/boxstudio-v49-mobile-dom.log || true; exit 1
          fi
