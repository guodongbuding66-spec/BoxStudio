name: Apply BoxStudio V0.9

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v09-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply V0.9 payload
        shell: bash
        run: |
          set -euo pipefail
          echo "474502a5b11c7e72df15a4b6f8f0a79b97ca1221e2c4883051edab91b8c3c790  .sync/v09.part00a" | sha256sum -c -
          echo "30e3c112d94ff7329569b39daf275c8f2ed20b0970e6ee214a4625d1da09dc29  .sync/v09.part00b" | sha256sum -c -
          echo "5b29c0cf85e38030ac70e195da62397d23e5de00b196ca1a3b6d3ad332a9a46b  .sync/v09.part00c" | sha256sum -c -
          echo "1a4ee8a89e4157ee14b9eaa92c0d63360e0aa66062113088a42b324bbbc5caf4  .sync/v09.part01" | sha256sum -c -
          echo "5120bae7e6776a5e6e5c912d26be3bbb0865b39b5bd8bc8a550be5cb7f7389d6  .sync/v09.part02" | sha256sum -c -
          cat .sync/v09.part00a .sync/v09.part00b .sync/v09.part00c .sync/v09.part01 .sync/v09.part02 > /tmp/boxstudio-v09-patch.tar.xz
          echo "14e7f565ba4367e472e08916af04ce0c865d39f0ed0a08348059edbe17a0e790  /tmp/boxstudio-v09-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/boxstudio-v09-patch.tar.xz -C .
          rm -rf .sync
          rm -f .github/workflows/apply-v09.yml

      - name: Validate V0.9
        shell: bash
        run: |
          set -euo pipefail
          grep -q '# BoxStudio V0.9' README.md
          grep -q '"version": "0.9.0"' package.json
          for f in src/*.js tests/smoke.mjs; do node --check "$f"; done
          node tests/smoke.mjs

      - name: Commit V0.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade BoxStudio to V0.9 [v09-applied]"
          git push origin HEAD:main
