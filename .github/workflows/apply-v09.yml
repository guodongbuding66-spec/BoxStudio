name: Apply BoxStudio V0.9

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v09-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V0.9 payload parts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .sync/v09.part00 .sync/v09.part01 .sync/v09.part02
          echo "3b64485e06fbfa1d80f8da30a01322a42bb69aa58046d8065af3c62439d0aa75  .sync/v09.part00" | sha256sum -c -
          echo "1a4ee8a89e4157ee14b9eaa92c0d63360e0aa66062113088a42b324bbbc5caf4  .sync/v09.part01" | sha256sum -c -
          echo "5120bae7e6776a5e6e5c912d26be3bbb0865b39b5bd8bc8a550be5cb7f7389d6  .sync/v09.part02" | sha256sum -c -
          cat .sync/v09.part00 .sync/v09.part01 .sync/v09.part02 > /tmp/boxstudio-v09-patch.tar.xz
          echo "14e7f565ba4367e472e08916af04ce0c865d39f0ed0a08348059edbe17a0e790  /tmp/boxstudio-v09-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/boxstudio-v09-patch.tar.xz -C .
          rm -rf .sync
          rm -f .github/workflows/apply-v09.yml

      - name: Validate V0.9
        shell: bash
        run: |
          set -euo pipefail
          grep -q '# BoxStudio V0.9' README.md
          grep -q '"version": "0.9.0"' package.json
          for f in src/*.js tests/smoke.mjs; do node --check "$f"; done
          node tests/smoke.mjs

      - name: Commit V0.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade BoxStudio to V0.9 [v09-applied]"
          git push origin HEAD:main
