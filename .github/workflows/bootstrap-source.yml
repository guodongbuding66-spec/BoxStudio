name: Bootstrap BoxStudio source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified V0.7 migration snapshot
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/guodongbuding66-spec/carton-artwork-studio/boxstudio-v0.7-sync/.sync'
          curl -fL "$base/boxstudio-v07-core.tar.xz" -o /tmp/boxstudio-v07-core.tar.xz
          curl -fL "$base/reference-template-from-pdf.svg.xz" -o /tmp/reference-template-from-pdf.svg.xz
          curl -fL "$base/sample-batch.xlsx" -o /tmp/sample-batch.xlsx
          curl -fL "$base/sample-dieline.pdf" -o /tmp/sample-dieline.pdf

      - name: Expand source into new repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boxstudio-v07
          tar -xJf /tmp/boxstudio-v07-core.tar.xz -C /tmp/boxstudio-v07
          cp -a /tmp/boxstudio-v07/. .
          mkdir -p assets
          xz -dc /tmp/reference-template-from-pdf.svg.xz > assets/reference-template-from-pdf.svg
          cp /tmp/sample-batch.xlsx assets/sample-batch.xlsx
          cp /tmp/sample-dieline.pdf assets/sample-dieline.pdf
          cp /tmp/sample-dieline.pdf assets/sample-dieline.ai
          rm -rf .github

      - name: Validate migrated V0.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f package.json
          test -f src/app.js
          test -f src/export.js
          test -f assets/reference-template-from-pdf.svg
          test -f assets/sample-batch.xlsx
          for f in src/*.js tests/smoke.mjs; do node --check "$f"; done
          node tests/smoke.mjs

      - name: Commit migration baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: migrate BoxStudio V0.7 baseline [bootstrap-applied]'
          git push origin HEAD:main
