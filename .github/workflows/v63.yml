name: V0.63 Artwork Workspace Consolidation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  studio-consolidation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: V0.63 syntax
        run: |
          node --check src/studioShellV63.js
          node --check src/v63Ui.js
          node --check tests/v63.mjs
          node --check tests/v63-browser-e2e.js
          python3 -m py_compile tests/v63_e2e_server.py
      - name: V0.62 print-readiness baseline
        run: node tests/v62.mjs
      - name: V0.61 artwork baseline
        run: node tests/v61.mjs
      - name: V0.39 production baseline
        run: node tests/v39.mjs
      - name: V0.63 studio model
        run: node tests/v63.mjs
      - name: V0.63 wiring
        run: |
          grep -q '"version": "0.63.0"' package.json
          grep -q '"test:v63"' package.json
          grep -q 'BoxStudio V0.63' index.html
          grep -q 'v63Ui.css' index.html
          grep -q 'v63Ui.js' index.html
          grep -q 'V63_PRODUCT_VERSION' src/studioShellV63.js
          grep -q 'v63-stagebar' src/v63Ui.js
          grep -q 'v60ArtworkFile' src/v63Ui.js
      - name: Real Chrome V0.63 unified studio
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v63-started /tmp/boxstudio-v63-pass /tmp/boxstudio-v63-fail
          python3 tests/v63_e2e_server.py >/tmp/boxstudio-v63-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8793/tests/v63-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 120s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --window-size=1280,900 --virtual-time-budget=70000 --dump-dom http://127.0.0.1:8793/tests/v63-browser-e2e.html >/tmp/boxstudio-v63-dom.log 2>/tmp/boxstudio-v63-chrome.log || true
          if test -f /tmp/boxstudio-v63-pass; then
            echo 'Desktop V0.63:'; cat /tmp/boxstudio-v63-pass
          elif test -f /tmp/boxstudio-v63-fail; then
            cat /tmp/boxstudio-v63-fail; cat /tmp/boxstudio-v63-chrome.log || true; cat /tmp/boxstudio-v63-dom.log || true; exit 1
          else
            echo 'V0.63 desktop browser E2E ended without PASS/FAIL signal.'; cat /tmp/boxstudio-v63-http.log || true; cat /tmp/boxstudio-v63-chrome.log || true; cat /tmp/boxstudio-v63-dom.log || true; exit 1
          fi
          rm -f /tmp/boxstudio-v63-pass /tmp/boxstudio-v63-fail
          timeout 120s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --window-size=390,844 --virtual-time-budget=70000 --dump-dom http://127.0.0.1:8793/tests/v63-browser-e2e.html >/tmp/boxstudio-v63-mobile-dom.log 2>/tmp/boxstudio-v63-mobile-chrome.log || true
          if test -f /tmp/boxstudio-v63-pass; then
            echo 'Mobile V0.63:'; cat /tmp/boxstudio-v63-pass
          elif test -f /tmp/boxstudio-v63-fail; then
            cat /tmp/boxstudio-v63-fail; cat /tmp/boxstudio-v63-mobile-chrome.log || true; cat /tmp/boxstudio-v63-mobile-dom.log || true; exit 1
          else
            echo 'V0.63 mobile browser E2E ended without PASS/FAIL signal.'; cat /tmp/boxstudio-v63-http.log || true; cat /tmp/boxstudio-v63-mobile-chrome.log || true; cat /tmp/boxstudio-v63-mobile-dom.log || true; exit 1
          fi
