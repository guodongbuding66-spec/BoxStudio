name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js tests/*.mjs; do
            node --check "$f"
          done

      - name: Smoke tests
        run: node tests/smoke.mjs

      - name: V0.10 profile and master-template tests
        run: node tests/v10.mjs

      - name: V0.11 rule editor, revisions and batch-master tests
        run: node tests/v11.mjs

      - name: V0.12 queue, bundle, asset and rule-history tests
        run: node tests/v12.mjs
