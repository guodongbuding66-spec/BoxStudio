name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js tests/smoke.mjs; do
            node --check "$f"
          done

      - name: Smoke tests
        run: node tests/smoke.mjs
