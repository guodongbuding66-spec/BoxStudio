name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js tests/*.mjs; do node --check "$f"; done
      - name: Smoke tests
        run: node tests/smoke.mjs
      - name: V0.10 profile and master-template tests
        run: node tests/v10.mjs
      - name: V0.11 rule editor, revisions and batch-master tests
        run: node tests/v11.mjs
      - name: V0.12 queue, bundle, asset and rule-history tests
        run: node tests/v12.mjs
      - name: V0.13 pause-resume, mark-layout and approval tests
        run: node tests/v13.mjs
      - name: V0.14 persistence, artifacts and role tests
        run: node tests/v14.mjs
      - name: V0.15 SVG, worker PDF and merge tests
        run: node tests/v15.mjs
      - name: V0.16 worker assets, granular merge and artwork tests
        run: node tests/v16.mjs
      - name: V0.17 folded artwork texture proof tests
        run: node tests/v17.mjs
      - name: V0.18 SVG appearance and fold bleed tests
        run: node tests/v18.mjs
      - name: V0.19 production appearance and cross-panel tests
        run: node tests/v19.mjs
      - name: V0.20 native SVG, atlas and z-order tests
        run: node tests/v20.mjs
      - name: V0.21 native PDF shading and transform tests
        run: node tests/v21.mjs
      - name: V0.22 soft-mask, clip and shared-transform tests
        run: node tests/v22.mjs
      - name: V0.23 integrated PDF, ICC DeviceLink, clip-point and spacing tests
        run: node tests/v23.mjs
      - name: V0.24 native batch, deterministic context and approved-export tests
        run: node tests/v24.mjs
      - name: V0.25 Bezier clip, Smart Guide and LUT16 DeviceLink tests
        run: node tests/v25.mjs
      - name: V0.26 persistent guides, numeric clips and native cubic PDF tests
        run: node tests/v26.mjs
      - name: V0.27 native cubic production, worker batch and live-assist tests
        run: node tests/v27.mjs
      - name: V0.28 object-relative group rotation and baseline-gap audit tests
        run: node tests/v28.mjs
      - name: V0.29 resilient import, source-lineage and failed-row review tests
        run: node tests/v29.mjs
      - name: V0.30 mapping-profile, leading-zero, import-review and XLSX-failure tests
        run: node tests/v30.mjs

      - name: V0.31 isolate - raw geometry gate
        env: { V31_BASE_PROBE: geometry }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 isolate - raw digital decode gate
        env: { V31_BASE_PROBE: digital }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 isolate - aggregate gate
        env: { V31_BASE_PROBE: aggregate }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 isolate - accepted wrapper
        env: { V31_BASE_PROBE: accepted }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 isolate - PDF bytes and signature
        env: { V31_BASE_PROBE: bytes }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 isolate - MediaBox
        env: { V31_BASE_PROBE: media }
        run: node tests/v31-base-probe.mjs
      - name: V0.31 enforce - mailer 200x64 details
        env: { V31_PROBE: exact-mailer-details }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - symbology result types
        env: { V31_PROBE: exact-type-details }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - outlined text final-PDF geometry
        env: { V31_PROBE: outlined-text }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - damaged final-PDF barcode must block
        env: { V31_PROBE: damaged-pdf }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - exact negative details
        env: { V31_PROBE: exact-negative-details }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - full sequence in one process
        env: { V31_PROBE: sequence-all }
        run: node tests/v31-probe.mjs
      - name: V0.31 enforce - release metadata
        env: { V31_PROBE: meta }
        run: node tests/v31-probe.mjs
      - name: V0.31 Production PDF digital-decode and geometry-acceptance tests
        run: node tests/v31.mjs

  v31-digital-isolation:
    name: V0.31 Digital isolate (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [result, barcode, qr]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check ${{ matrix.check }}
        env:
          V31_DIGITAL_CHECK: ${{ matrix.check }}
        run: node tests/v31-digital-probe.mjs
