name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js tests/*.mjs tests/*-browser-e2e.js; do
            node --check "$f"
          done

      - name: Smoke tests
        run: node tests/smoke.mjs

      - name: V0.10 profile and master-template tests
        run: node tests/v10.mjs

      - name: V0.11 rule editor, revisions and batch-master tests
        run: node tests/v11.mjs

      - name: V0.12 queue, bundle, asset and rule-history tests
        run: node tests/v12.mjs

      - name: V0.13 pause-resume, mark-layout and approval tests
        run: node tests/v13.mjs

      - name: V0.14 persistence, artifacts and role tests
        run: node tests/v14.mjs

      - name: V0.15 SVG, worker PDF and merge tests
        run: node tests/v15.mjs

      - name: V0.16 worker assets, granular merge and artwork tests
        run: node tests/v16.mjs

      - name: V0.17 folded artwork texture proof tests
        run: node tests/v17.mjs

      - name: V0.18 SVG appearance and fold bleed tests
        run: node tests/v18.mjs

      - name: V0.19 production appearance and cross-panel tests
        run: node tests/v19.mjs

      - name: V0.20 native SVG, atlas and z-order tests
        run: node tests/v20.mjs

      - name: V0.21 native PDF shading and transform tests
        run: node tests/v21.mjs

      - name: V0.22 soft-mask, clip and shared-transform tests
        run: node tests/v22.mjs

      - name: V0.23 integrated PDF, ICC DeviceLink, clip-point and spacing tests
        run: node tests/v23.mjs

      - name: V0.24 native batch, deterministic context and approved-export tests
        run: node tests/v24.mjs

      - name: V0.25 Bezier clip, Smart Guide and LUT16 DeviceLink tests
        run: node tests/v25.mjs

      - name: V0.26 persistent guides, numeric clips and native cubic PDF tests
        run: node tests/v26.mjs

      - name: V0.27 native cubic production, worker batch and live-assist tests
        run: node tests/v27.mjs

      - name: V0.28 object-relative group rotation and baseline-gap audit tests
        run: node tests/v28.mjs

      - name: V0.29 resilient import, source-lineage and failed-row review tests
        run: node tests/v29.mjs

      - name: V0.30 mapping-profile, leading-zero, import-review and XLSX-failure tests
        run: node tests/v30.mjs

      - name: V0.31 production PDF digital-decode and geometry-acceptance tests
        run: node tests/v31.mjs

      - name: V0.31 hardening - final-PDF damage, outlined text, rotation and fail-closed gates
        run: node tests/v31-hardening.mjs

      - name: V0.32 parametric template core - five engines, size modes, board compensation and catalog
        run: node tests/v32.mjs

      - name: V0.33 professional 2D editor - selection, group, clipboard, z-order, layers, table and SVG image
        run: node tests/v33.mjs

      - name: V0.33 browser interaction - open editor, duplicate, numeric edit and table
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v33-started /tmp/boxstudio-v33-pass /tmp/boxstudio-v33-fail
          python3 tests/v33_e2e_server.py >/tmp/boxstudio-v33-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/tests/v33-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/tests/v33-browser-e2e.html >/tmp/boxstudio-v33-dom.log 2>/tmp/boxstudio-v33-chrome.log || true
          if test -f /tmp/boxstudio-v33-pass; then
            cat /tmp/boxstudio-v33-pass
          elif test -f /tmp/boxstudio-v33-fail; then
            cat /tmp/boxstudio-v33-fail
            cat /tmp/boxstudio-v33-chrome.log || true
            cat /tmp/boxstudio-v33-dom.log || true
            exit 1
          else
            echo 'Browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v33-http.log || true
            cat /tmp/boxstudio-v33-chrome.log || true
            cat /tmp/boxstudio-v33-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: V0.34 Marks Studio - components, variables, blocks, presets and conditional rules
        run: node tests/v34.mjs

      - name: V0.34 browser interaction - component, variable, rule visibility and reusable block
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v34-started /tmp/boxstudio-v34-pass /tmp/boxstudio-v34-fail
          python3 tests/v34_e2e_server.py >/tmp/boxstudio-v34-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8766/tests/v34-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8766/tests/v34-browser-e2e.html >/tmp/boxstudio-v34-dom.log 2>/tmp/boxstudio-v34-chrome.log || true
          if test -f /tmp/boxstudio-v34-pass; then
            cat /tmp/boxstudio-v34-pass
          elif test -f /tmp/boxstudio-v34-fail; then
            cat /tmp/boxstudio-v34-fail
            cat /tmp/boxstudio-v34-chrome.log || true
            cat /tmp/boxstudio-v34-dom.log || true
            exit 1
          else
            echo 'V0.34 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v34-http.log || true
            cat /tmp/boxstudio-v34-chrome.log || true
            cat /tmp/boxstudio-v34-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: V0.35 2D-3D linked review - selection, diagnostics, material and fold state
        run: node tests/v35.mjs

      - name: V0.35 browser interaction - 2D focus, exact edit, material and live fold proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v35-started /tmp/boxstudio-v35-pass /tmp/boxstudio-v35-fail
          python3 tests/v35_e2e_server.py >/tmp/boxstudio-v35-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8767/tests/v35-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8767/tests/v35-browser-e2e.html >/tmp/boxstudio-v35-dom.log 2>/tmp/boxstudio-v35-chrome.log || true
          if test -f /tmp/boxstudio-v35-pass; then
            cat /tmp/boxstudio-v35-pass
          elif test -f /tmp/boxstudio-v35-fail; then
            cat /tmp/boxstudio-v35-fail
            cat /tmp/boxstudio-v35-chrome.log || true
            cat /tmp/boxstudio-v35-dom.log || true
            exit 1
          else
            echo 'V0.35 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v35-http.log || true
            cat /tmp/boxstudio-v35-chrome.log || true
            cat /tmp/boxstudio-v35-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
