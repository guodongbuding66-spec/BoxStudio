name: V0.41 Reference Interaction Layer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-interactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and policy checks
        run: |
          node --check src/v41Ui.js
          node --check tests/v41-browser-e2e.js
          grep -q "freeAccess:true" src/v41Ui.js
          grep -q "approvalRequired:false" src/v41Ui.js
          grep -q "v41Ui.js" index.html
          grep -q "v41Ui.css" index.html
      - name: Real Chrome template-generator workflow
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v41-started /tmp/boxstudio-v41-pass /tmp/boxstudio-v41-fail
          python3 tests/v41_e2e_server.py >/tmp/boxstudio-v41-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8771/tests/v41-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 90s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=60000 --dump-dom http://127.0.0.1:8771/tests/v41-browser-e2e.html >/tmp/boxstudio-v41-dom.log 2>/tmp/boxstudio-v41-chrome.log || true
          if test -f /tmp/boxstudio-v41-pass; then
            cat /tmp/boxstudio-v41-pass
          elif test -f /tmp/boxstudio-v41-fail; then
            cat /tmp/boxstudio-v41-fail
            cat /tmp/boxstudio-v41-chrome.log || true
            cat /tmp/boxstudio-v41-dom.log || true
            exit 1
          else
            echo 'V0.41 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v41-http.log || true
            cat /tmp/boxstudio-v41-chrome.log || true
            cat /tmp/boxstudio-v41-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
