name: V0.43 Native Curved Production

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-curves:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked runtime and browser-test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare
      - name: Syntax and native curve regression
        run: |
          node --check src/curvedGeometryV43.js
          node --check src/geometry.js
          node --check src/productionExportV38.js
          node --check src/productionPdfV23.js
          node --check src/productionPdfV43.js
          node --check src/preflightV43.js
          node --check src/v43Ui.js
          node --check tests/v43.mjs
          node --check tests/v43-browser-e2e.js
          node tests/v42.mjs
          node tests/v43.mjs
          grep -q "v43Ui.js" index.html
          grep -q "v43Ui.css" index.html
          grep -q "nativeStructuralCurves===true" src/productionPdfV23.js
          grep -q "cornerRadiusProductionCurve:true" src/v43Ui.js
          grep -q "dxfNativeArcSpline:true" src/v43Ui.js
          grep -q "pdfNativeCubic:true" src/v43Ui.js
      - name: Real Chrome native curve workflow
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v43-started /tmp/boxstudio-v43-pass /tmp/boxstudio-v43-fail
          python3 tests/v43_e2e_server.py >/tmp/boxstudio-v43-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8773/tests/v43-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 100s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=70000 --dump-dom http://127.0.0.1:8773/tests/v43-browser-e2e.html >/tmp/boxstudio-v43-dom.log 2>/tmp/boxstudio-v43-chrome.log || true
          if test -f /tmp/boxstudio-v43-pass; then
            cat /tmp/boxstudio-v43-pass
          elif test -f /tmp/boxstudio-v43-fail; then
            cat /tmp/boxstudio-v43-fail
            cat /tmp/boxstudio-v43-chrome.log || true
            cat /tmp/boxstudio-v43-dom.log || true
            exit 1
          else
            echo 'V0.43 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v43-http.log || true
            cat /tmp/boxstudio-v43-chrome.log || true
            cat /tmp/boxstudio-v43-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
