name: V0.39 Unified Topology Production

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  topology-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: V0.39 syntax checks
        run: |
          node --check src/structuralTopologyEngineV39.js
          node --check src/structuralTopologyV39.js
          node --check src/productionPdfV39.js
          node --check src/v39Ui.js
          node --check tests/v39.mjs
          node --check tests/v39-browser-e2e.js
      - name: V0.39 edited dieline to panels, fold graph, artwork and full Production PDF
        run: node tests/v39.mjs
      - name: V0.39 real browser CAD edit to rebuilt topology and full Production PDF
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -f /tmp/boxstudio-v39-started /tmp/boxstudio-v39-pass /tmp/boxstudio-v39-fail
          python3 tests/v39_e2e_server.py >/tmp/boxstudio-v39-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8769/tests/v39-browser-e2e.html >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8769/tests/v39-browser-e2e.html >/tmp/boxstudio-v39-dom.log 2>/tmp/boxstudio-v39-chrome.log || true
          if test -f /tmp/boxstudio-v39-pass; then
            cat /tmp/boxstudio-v39-pass
          elif test -f /tmp/boxstudio-v39-fail; then
            cat /tmp/boxstudio-v39-fail
            cat /tmp/boxstudio-v39-chrome.log || true
            cat /tmp/boxstudio-v39-dom.log || true
            exit 1
          else
            echo 'V0.39 browser E2E ended without PASS/FAIL signal.'
            cat /tmp/boxstudio-v39-http.log || true
            cat /tmp/boxstudio-v39-chrome.log || true
            cat /tmp/boxstudio-v39-dom.log || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
